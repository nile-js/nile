name: Security audit

on:
  push:
    branches: [main, release/nile-js-v1]
  pull_request:
    branches: [main]
  schedule:
    # Daily dependency vulnerability scan.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency vulnerability audit
        run: bun audit

      - name: Run security test suite
        working-directory: ./packages/nile
        run: bun run test:security
