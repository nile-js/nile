version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nile-runtime:
        patterns:
          - "@hono/*"
          - "@opentelemetry/*"
          - "hono"
          - "nanoid"
          - "pino"
          - "socket.io"
          - "@socket.io/*"
          - "zod"
          - "croner"
          - "slang-ts"
    ignore:
      # Major version bumps require review before they land.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/packages/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      web-runtime:
        patterns:
          - "react-router"
          - "@react-router/*"
          - "vite"
          - "tailwindcss"
          - "fumadocs-*"
          - "shiki"
          - "@tailwindcss/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/packages/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      client-runtime:
        patterns:
          - "vitest"
          - "tsup"
          - "@vitest/*"
          - "socket.io-client"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
