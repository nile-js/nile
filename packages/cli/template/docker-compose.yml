services:
  nile:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    volumes:
      # The starter keeps its PGlite database in ./data; this volume keeps it across restarts.
      - nile_data:/app/data
    restart: unless-stopped

volumes:
  nile_data:
