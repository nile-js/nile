<text x="62" y="724.84" fill="#999296" font-family="Fira Mono, monospace" font-size="12" font-weight="400" text-anchor="start">HOW WE TESTED</text>
<text x="62" y="752.12" fill="#999296" font-family="Fira Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">We built the same shopping API in each framework, with 300 operations.</text>
<text x="62" y="777.12" fill="#999296" font-family="Fira Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Up to 32 simulated shoppers browsed products, filled carts and placed orders at once.</text>
<text x="62" y="802.12" fill="#999296" font-family="Fira Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">We sent 500 practice journeys, then timed 5,000 journeys. Each journey made 6 requests.</text>
<text x="62" y="827.12" fill="#999296" font-family="Fira Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Every framework ran in each of 6 rounds. The chart shows its average requests per second.</text>
<text x="62" y="852.12" fill="#999296" font-family="Fira Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Responses and order counts were checked. Data stayed in memory, with no database.</text>
<text x="62" y="890.84" fill="#999296" font-family="Fira Mono, monospace" font-size="12" font-weight="400" text-anchor="start">BENCHMARK MACHINE</text>
<text x="62" y="918.12" fill="#999296" font-family="Fira Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Intel Core i5-6300U @ 2.40 GHz · 4 logical CPUs · 15.5 GiB RAM</text>
<text x="62" y="945.48" fill="#857c83" font-family="Fira Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">The app and test client shared this PC. Other apps were running and could affect the results.</text>
